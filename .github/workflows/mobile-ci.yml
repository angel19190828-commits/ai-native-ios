name: Mobile CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - name: Install API dependencies
        run: npm ci
      - name: Install mobile dependencies
        run: npm ci --prefix apps/mobile
      - name: Test API
        run: npm run test:api
      - name: Test mobile domain and integrations
        run: npm run mobile:test
      - name: Type-check mobile app
        run: npm run mobile:typecheck
      - name: Check release configuration
        run: npm run release:check:static
      - name: Check Expo dependency health
        working-directory: apps/mobile
        run: npx expo-doctor
      - name: Export Android production bundle
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir ../../dist/mobile-android
      - name: Upload Android bundle
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android-export
          path: dist/mobile-android
          if-no-files-found: error
          retention-days: 7
