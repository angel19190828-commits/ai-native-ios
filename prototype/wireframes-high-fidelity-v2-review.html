<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI iOS Review Board</title><style>
:root{--ink:#15171b;--muted:#69717c;--line:#d8dde4;--paper:#f1f3f6;--blue:#1769e8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,a,textarea{font:inherit}.top{position:sticky;z-index:20;top:0;padding:18px clamp(16px,4vw,52px);border-bottom:1px solid #15171b12;background:#f1f3f6eb;backdrop-filter:blur(18px)}.row,.controls,.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row{justify-content:space-between;gap:24px}.eyebrow{margin:0 0 4px;color:var(--blue);font:700 10px ui-monospace;letter-spacing:.13em}h1{margin:0;font-size:clamp(25px,3vw,40px);letter-spacing:-.045em}.mode,.filter,.link,.copy{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#ffffffbf;color:#404751;text-decoration:none;cursor:pointer}.mode.active,.filter.active{border-color:var(--blue);background:#eaf2ff;color:#1259bd}.copy{background:#17233a;color:#fff}.filters{display:none;margin-top:12px}.annotating .filters{display:flex}main{max-width:1500px;margin:auto;padding:24px clamp(14px,3vw,44px) 90px}.intro{display:flex;justify-content:space-between;gap:20px;margin-bottom:18px;color:var(--muted);font-size:13px}.picker{display:flex;gap:7px;margin-bottom:14px;overflow-x:auto}.chip{flex:0 0 auto;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#5c6470;cursor:pointer}.chip.active{border-color:var(--blue);background:#eaf2ff;color:#1259bd}.head{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;margin-bottom:9px}.id{display:grid;place-items:center;height:31px;border-radius:9px;background:#17233a;color:#fff;font:700 11px ui-monospace}.head h2{margin:0;font-size:16px}.head p{margin:2px 0 0;color:var(--muted);font-size:10px}.open{display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#4d5662;text-decoration:none}.frame{height:790px;overflow:hidden;border:1px solid #cbd0d7;border-radius:24px;background:#e8ebef;box-shadow:0 18px 46px #1923321a}.frame iframe{display:block;width:100%;height:790px;border:0}.prevnext{display:flex;justify-content:space-between;margin-top:10px}.prevnext button{padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}.board{display:none;grid-template-columns:minmax(0,1fr);gap:48px;max-width:1080px;margin:0 auto}.annotating .viewer{display:none}.annotating .board{display:grid}.card[hidden]{display:none}.card.branch .id{background:#604615}.card.system .id{background:#315146}.note{margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:13px;background:#fff}.note label{display:block;margin-bottom:6px;font-size:10px;font-weight:700}.note textarea{width:100%;min-height:76px;padding:10px;border:1px solid #d4dae2;border-radius:9px;background:#f7f8fa;font-size:12px;resize:vertical}.note small{color:#84909e}.toast{position:fixed;right:20px;bottom:20px;padding:10px 14px;border-radius:10px;background:#17233a;color:#fff;opacity:0;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:840px){.row,.intro{align-items:flex-start;flex-direction:column}.board{grid-template-columns:1fr}.frame,.frame iframe{height:760px}}@media(max-width:460px){.top{position:relative}.frame,.frame iframe{height:720px}}
</style></head><body class="annotating"><header class="top"><div class="row"><div><p class="eyebrow">SCREEN REVIEW · V3</p><h1>原型浏览与标注</h1></div><nav class="controls"><button class="mode" data-mode="browse">浏览</button><button class="mode active" data-mode="annotate">标注</button><button class="copy" id="copy">复制全部反馈</button><a class="link" href="wireframes-high-fidelity-v2.html">交互原型 ↗</a></nav></div><div class="filters"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="main">主流程</button><button class="filter" data-filter="branch">条件分支</button><button class="filter" data-filter="system">系统说明</button></div></header><main><section class="intro"><span id="help">全部 Screen 已按流程展开，可直接向下滚动并逐屏标注。</span><span>S = 主流程 · B = 分支 · X = 系统</span></section><section class="viewer"><nav class="picker" id="picker"></nav><div id="viewer"></div></section><section class="board" id="board"></section></main><div class="toast" id="toast"></div><script>
const screens=[['S01','main','mail','AI 建议','邮件上层轻量入口'],['S01A','main','assistant','AI 助手','点击灵动岛后的通用入口'],['S02','main','processing','AI 规划中','灵动岛后台进度'],['S03','main','action','需要决定','课程与面试冲突'],['S04','main','plan','最终计划','新版对话式计划'],['S05','main','task','面试已安排','系统设置与用户待办'],['S06','main','today','面试当天','实时交通与行动建议'],['B01','branch','options','改期方案','联系 Alex 与草稿'],['B02','branch','failed','部分失败','单步重试或撤销'],['B03','branch','missingInfo','信息缺失','仅询问缺失字段'],['B04','branch','commute','通勤建议','对话式通勤确认'],['B05','branch','options','改期草稿','Gallery 与草稿确认','draft'],['X01','system','sources','来源与权限','本次数据访问范围']].map(x=>({id:x[0],group:x[1],state:x[2],title:x[3],note:x[4],option:x[5]||''}));const base='wireframes-high-fidelity-v2.html',v='89';let active=0;const u=s=>base+'?embed=1&review=1&v='+v+'&screen='+s.state+(s.option?'&option='+s.option:''),ext=s=>base+'?review=1&v='+v+'&screen='+s.state+(s.option?'&option='+s.option:''),picker=document.querySelector('#picker'),viewer=document.querySelector('#viewer'),board=document.querySelector('#board'),copy=document.querySelector('#copy');
picker.innerHTML=screens.map((s,i)=>'<button class="chip '+(i?'':'active')+'" data-i="'+i+'">'+s.id+' · '+s.title+'</button>').join('');function show(){const s=screens[active];document.querySelectorAll('.chip').forEach((b,i)=>b.classList.toggle('active',i===active));viewer.innerHTML='<header class="head"><span class="id">'+s.id+'</span><div><h2>'+s.title+'</h2><p>'+s.note+'</p></div><a class="open" target="_blank" href="'+ext(s)+'">↗</a></header><div class="frame"><iframe src="'+u(s)+'"></iframe></div><nav class="prevnext"><button data-step="-1">← 上一个</button><button data-step="1">下一个 →</button></nav>'}picker.onclick=e=>{const b=e.target.closest('[data-i]');if(b){active=+b.dataset.i;show()}};viewer.onclick=e=>{const b=e.target.closest('[data-step]');if(b){active=(active+(+b.dataset.step)+screens.length)%screens.length;show()}};show();
board.innerHTML=screens.map(s=>'<article class="card '+s.group+'" data-group="'+s.group+'"><header class="head"><span class="id">'+s.id+'</span><div><h2>'+s.title+'</h2><p>'+s.note+'</p></div><a class="open" target="_blank" href="'+ext(s)+'">↗</a></header><div class="frame"><iframe loading="lazy" src="'+u(s)+'"></iframe></div><div class="note"><label>'+s.id+' 反馈</label><textarea data-note="'+s.id+'" placeholder="写修改，例如：改成输入框预填文字…"></textarea><small>自动保存在此浏览器</small></div></article>').join('');document.querySelectorAll('[data-note]').forEach(t=>{t.value=localStorage.getItem('review-'+t.dataset.note)||'';t.oninput=()=>localStorage.setItem('review-'+t.dataset.note,t.value)});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{const a=b.dataset.mode==='annotate';document.body.classList.toggle('annotating',a);document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));copy.hidden=!a;document.querySelector('#help').textContent=a?'在 Screen 下填写反馈，自动保存后一次复制。':'一次查看一个 Screen，通过编号切换。';if(a)document.querySelectorAll('iframe[data-src]').forEach(f=>{if(!f.src)f.src=f.dataset.src})});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.card').forEach(c=>c.hidden=b.dataset.filter!=='all'&&c.dataset.group!==b.dataset.filter)});copy.onclick=async()=>{const text=screens.map(s=>{const n=(localStorage.getItem('review-'+s.id)||'').trim();return n?s.id+' '+s.title+'\n'+n:''}).filter(Boolean).join('\n\n');toast(text?await navigator.clipboard.writeText(text).then(()=> '已复制全部反馈').catch(()=> '复制失败'):'还没有填写反馈')};function toast(x){const t=document.querySelector('#toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
</script></body></html>
