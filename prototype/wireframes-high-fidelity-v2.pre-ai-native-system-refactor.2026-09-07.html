function englishTime(hour,minute){const h=Number(hour),suffix=h>=12?'PM':'AM';return ((h%12)||12)+':'+minute+' '+suffix}
function translateValue(raw,target=uiLanguage){
  if(!raw||target!=='en')return raw;
  let value=raw;
  Object.entries(COPY_V7).sort((a,b)=>b[0].length-a[0].length).forEach(([zh,en])=>{if(value.includes(zh))value=value.split(zh).join(en)});
  value=value.replace(/(\d{1,2})\s*月\s*(\d{1,2})\s*日(?:(?:（星期([一二三四五六日天])）)|(?:\s*·\s*星期([一二三四五六日天])))?/g,(_,month,day,weekdayA,weekdayB)=>{const weekday=weekdayA||weekdayB,weekdays={一:'Mon',二:'Tue',三:'Wed',四:'Thu',五:'Fri',六:'Sat',日:'Sun',天:'Sun'},months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return (weekday?weekdays[weekday]+', ':'')+months[Number(month)-1]+' '+Number(day)});
  value=value.replace(/(?<![\d:])(2[0-3]|[01]?\d):([0-5]\d)(?!\s*(?:AM|PM))/g,(_,hour,minute)=>englishTime(hour,minute));
  value=value.replace(/(\d{1,2}:\d{2}\s(?:AM|PM))\s+Depart/g,'Depart at $1').replace(/Estimated\s+(\d{1,2}:\d{2}\s(?:AM|PM))\s+arrival/g,'Estimated arrival $1').replace(/^(\d{1,2}:\d{2}\s(?:AM|PM))\s+arrival$/g,'Arrive $1').replace(/([A-Z][a-z]{2}, [A-Z][a-z]{2} \d{1,2})(\d{1,2}:\d{2}\s(?:AM|PM))/g,'$1 · $2');
  return value;
}

  if(isReview&&['suggest','processing','finishing','analysis','action','options','commute','reminders','plan','adjustMenu','calendarEdit','reminderEdit','executing','failed','task','taskMenu','sources','notificationSettings','home','route','today','navigate','navdone','draftSaved','paused','waiting','missingInfo','summary','thirdParty','stopConfirm','undo'].includes(requestedScreen))activeTask=true;
  if(['commute','reminders','plan','adjustMenu','calendarEdit','reminderEdit','executing','failed','task','taskMenu','sources','notificationSettings','home','route','today','navigate','navdone','undo','undone'].includes(requestedScreen)){origin='home';prep=45}
  if(requestedScreen==='processing'){render('processing');showProgress();if(isReview){processTimers.forEach(clearTimeout);processTimers=[]}}
  else render(requestedScreen)
}else render('mail');

// 77 · Research navigation stays out of the product experience until requested.
const prototypeNav=document.getElementById('prototypeNav');
const prototypeLayout=document.getElementById('prototypeLayout');
const prototypeNavToggle=document.getElementById('prototypeNavToggle');
const prototypeNavBody=document.getElementById('prototypeNavBody');
const languageToggle=document.createElement('div');
languageToggle.className='language-toggle-v7';

languageToggle.innerHTML='<button type="button" data-ui-language="zh">中</button><button type="button" data-ui-language="en">EN</button>';
prototypeNav.appendChild(languageToggle);
function syncLanguageToggle(){languageToggle.querySelectorAll('[data-ui-language]').forEach(button=>{const active=button.dataset.uiLanguage===uiLanguage;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active))})}
function setUiLanguage(language){
  if(!['zh','en'].includes(language))return;
  uiLanguage=language;
  isEnglish=language==='en';
  document.documentElement.lang=isEnglish?'en':'zh-CN';
  localStorage.setItem('ai-prototype-language',language);
  // Re-render from the current application state so dynamically-created sheets,
  // quick actions, composer copy and accessibility labels all read uiLanguage.
  // Live execution states keep their timers and are translated in place instead.
  const liveStates=['processing','finishing','executing'];
  if(!liveStates.includes(state))render(state);
  translateTree(ov,language);
  translateTree(isl,language);
  translateTree(app.querySelector('.nav'),language);
  translateTree(app.querySelector('.mail-head'),language);
  translateTree(prototypeNav,language);
  syncLanguageToggle();
}
languageToggle.addEventListener('click',event=>{const button=event.target.closest('[data-ui-language]');if(button)setUiLanguage(button.dataset.uiLanguage)});
syncLanguageToggle();
if(uiLanguage==='en'){translateTree(prototypeNav,'en');localizeUnified()}
function setPrototypeNav(open){
  prototypeNav.classList.toggle('is-collapsed',!open);
  prototypeLayout.classList.toggle('nav-collapsed',!open);
  prototypeNavToggle.setAttribute('aria-expanded',String(open));
  prototypeNavBody.setAttribute('aria-hidden',String(!open));
}
prototypeNavToggle.addEventListener('click',()=>setPrototypeNav(prototypeNav.classList.contains('is-collapsed')));
document.addEventListener('pointerdown',event=>{
  if(!prototypeNav.classList.contains('is-collapsed')&&!prototypeNav.contains(event.target))setPrototypeNav(false);
});
document.addEventListener('keydown',event=>{if(event.key==='Escape')setPrototypeNav(false)});

// 90 · Prompt pills compose into the conversation; the sheet stays mounted.
let simulatedKeyboardTarget=null;
function keyboardMarkup(){const rows=[...'QWERTYUIOP'].map(k=>'<button type="button" class="keyboard-key-v10" data-key="'+k.toLowerCase()+'">'+k+'</button>').join('');const middle=[...'ASDFGHJKL'].map(k=>'<button type="button" class="keyboard-key-v10" data-key="'+k.toLowerCase()+'">'+k+'</button>').join('');const bottom=[...'ZXCVBNM'].map(k=>'<button type="button" class="keyboard-key-v10" data-key="'+k.toLowerCase()+'">'+k+'</button>').join('');return '<div class="keyboard-row-v10">'+rows+'</div><div class="keyboard-row-v10">'+middle+'</div><div class="keyboard-row-v10"><button type="button" class="keyboard-key-v10 wide" data-key="shift">⇧</button>'+bottom+'<button type="button" class="keyboard-key-v10 wide" data-key="backspace">⌫</button></div><div class="keyboard-row-v10"><button type="button" class="keyboard-key-v10 wide" data-key="123">123</button><button type="button" class="keyboard-key-v10 space" data-key=" ">空格</button><button type="button" class="keyboard-key-v10 wide" data-key="return">完成</button></div><div class="keyboard-home-v10"></div>'}
function ensureSimulatedKeyboard(){let keyboard=document.querySelector('.ios-keyboard-v10');if(!keyboard){keyboard=document.createElement('div');keyboard.className='ios-keyboard-v10';keyboard.setAttribute('aria-label',tx('屏幕键盘','On-screen keyboard'));keyboard.innerHTML=keyboardMarkup();document.querySelector('.screen')?.appendChild(keyboard)}return keyboard}
function showSimulatedKeyboard(input){if(!input)return;simulatedKeyboardTarget=input;ensureSimulatedKeyboard().classList.add('visible');input.closest('.planning-sheet-v2')?.classList.add('keyboard-raised-v10');requestAnimationFrame(()=>input.scrollIntoView({block:'nearest',behavior:'smooth'}))}
function hideSimulatedKeyboard(){document.querySelector('.ios-keyboard-v10')?.classList.remove('visible');document.querySelector('.planning-sheet-v2.keyboard-raised-v10')?.classList.remove('keyboard-raised-v10');simulatedKeyboardTarget=null}
function animatePillToComposer(pill,input){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const screen=document.querySelector('.screen'),from=pill.getBoundingClientRect(),to=input.getBoundingClientRect(),host=screen?.getBoundingClientRect();if(!screen||!host)return;const ghost=document.createElement('span');ghost.className='pill-copy-flight-v11';ghost.textContent=pill.textContent.trim();ghost.style.left=(from.left-host.left)+'px';ghost.style.top=(from.top-host.top)+'px';ghost.style.width=Math.min(from.width,180)+'px';screen.appendChild(ghost);const dx=to.left+Math.min(to.width*.35,110)-from.left-Math.min(from.width*.35,70),dy=to.top+to.height/2-from.top-from.height/2;const animation=ghost.animate([{transform:'translate3d(0,0,0) scale(1)',opacity:1,filter:'blur(0)'},{offset:.72,transform:'translate3d('+dx+'px,'+dy+'px,0) scale(.82)',opacity:.9,filter:'blur(0)'},{transform:'translate3d('+dx+'px,'+dy+'px,0) scale(.62)',opacity:0,filter:'blur(2px)'}],{duration:380,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'});animation.finished.finally(()=>ghost.remove())}
function syncPromptPillsToComposer(pill){const sheet=pill.closest('.conversation-sheet-v4');const input=sheet?.querySelector('[data-decision-input]');if(!input)return;const group=pill.parentElement;const multi=pill.dataset.pillMode==='multi';if(multi){pill.classList.toggle('selected');pill.setAttribute('aria-pressed',String(pill.classList.contains('selected')))}else{group?.querySelectorAll('[data-prompt-pill]').forEach(button=>{const selected=button===pill;button.classList.toggle('selected',selected);button.setAttribute('aria-checked',String(selected))});if(pill.dataset.reminderLead)reminderLead=Number(pill.dataset.reminderLead)}if(pill.classList.contains('selected'))animatePillToComposer(pill,input);const selected=[...sheet.querySelectorAll('[data-prompt-pill].selected')].map(button=>button.textContent.trim());input.value=selected.join(uiLanguage==='en'?', ':'，');input.dispatchEvent(new Event('input',{bubbles:true}));input.focus();showSimulatedKeyboard(input)}
document.addEventListener('click',event=>{const pill=event.target.closest('[data-prompt-pill]');if(!pill)return;event.preventDefault();event.stopImmediatePropagation();syncPromptPillsToComposer(pill)},true);
document.addEventListener('click',event=>{const toggle=event.target.closest('[data-extra-requirements]');if(!toggle)return;event.preventDefault();event.stopImmediatePropagation();const panel=toggle.parentElement?.querySelector('[data-extra-requirements-panel]'),open=!panel?.classList.contains('open');panel?.classList.toggle('open',open);toggle.setAttribute('aria-expanded',String(open));toggle.querySelector('i').textContent=open?'−':'+';toggle.querySelector('span:last-child').textContent=open?'⌄':'›';if(open)requestAnimationFrame(()=>panel.querySelector('[data-custom-instruction]')?.focus())},true);
document.addEventListener('focusin',event=>{const input=event.target.closest('.planning-sheet-v2 input:not([type=file]):not([type=time]):not([type=date])');if(input)showSimulatedKeyboard(input)});
document.addEventListener('pointerdown',event=>{if(event.target.closest('.ios-keyboard-v10')){event.preventDefault();return}if(event.target.closest('[data-prompt-pill],.decision-input-v4,.task-form-v6 input'))return;if(document.querySelector('.ios-keyboard-v10.visible'))hideSimulatedKeyboard()},true);
document.addEventListener('click',event=>{const key=event.target.closest('[data-key]');if(!key||!simulatedKeyboardTarget)return;event.preventDefault();const value=key.dataset.key;if(value==='return'){hideSimulatedKeyboard();simulatedKeyboardTarget.blur();return}if(value==='shift'||value==='123')return;const input=simulatedKeyboardTarget,start=input.selectionStart??input.value.length,end=input.selectionEnd??start;if(value==='backspace'){if(start===end&&start>0)input.value=input.value.slice(0,start-1)+input.value.slice(end);else input.value=input.value.slice(0,start)+input.value.slice(end);const pos=start===end?Math.max(0,start-1):start;input.setSelectionRange(pos,pos)}else{input.value=input.value.slice(0,start)+value+input.value.slice(end);const pos=start+value.length;input.setSelectionRange(pos,pos)}input.dispatchEvent(new Event('input',{bubbles:true}));input.focus()},true);
document.addEventListener('click',event=>{if(event.target.closest('[data-a="submitDecisionContext"],[data-a="submitAndPlan"]'))hideSimulatedKeyboard()},true);
