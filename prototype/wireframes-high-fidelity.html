function fmt(n){n=(n+1440)%1440;return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
function eventTime(){const m=facts.dateTime.match(/([01]?\d|2[0-3]):([0-5]\d)/);return m?String(Number(m[1])).padStart(2,'0')+':'+m[2]:'10:30'}
function eventDateLabel(){return facts.dateTime.replace(/\s*\d{1,2}:\d{2}.*$/,'').trim()||'面试当天'}
function eventStart(){return timeToMinutes(eventTime())}

function hasConflict(){const d=facts.dateTime.replace(/\s/g,'');return (d.includes('7月28日')||d.includes('星期二'))&&eventStart()<660&&eventStart()+60>600}
function liveArrival(){return fmt(eventStart()-18)}

function duration(m=mode){return Math.max(8,modes[m].base+(origin?originDelta[origin]:0))}

$('#states').innerHTML=S.map((x,i)=>'<li><button data-s="'+x[0]+'">'+String(i+1).padStart(2,'0')+' · '+x[1]+'</button></li>').join('');
document.addEventListener('click',e=>{const sys=e.target.closest('[data-system]');if(sys){render(sys.dataset.system);return}const sb=e.target.closest('[data-s]');if(sb){const target=sb.dataset.s;if(target==='commute'){commuteStep=1;mapOpen=false;detailsOpen=false}if(['reminders','plan','executing','task','failed','route','today','navdone','complete'].includes(target)&&!origin)origin='home';if(['plan','executing','task','failed','route','today','navdone','complete'].includes(target)&&!prep)prep=45;render(target);return}const adjust=e.target.closest('[data-commute-adjust]');if(adjust){commuteStep=2;render('commute');return}const summaryBack=e.target.closest('[data-commute-summary]');if(summaryBack){commuteStep=1;render('commute');return}const oa=e.target.closest('[data-origin-adjust]');if(oa){origin=oa.dataset.originAdjust;if(!updateCommuteAdjust())render('commute');return}const ma=e.target.closest('[data-mode-adjust]');if(ma){mode=ma.dataset.modeAdjust;if(!updateCommuteAdjust())render('commute');return}const back=e.target.closest('[data-commute-back]');if(back){commuteStep=Number(back.dataset.commuteBack);render('commute');return}const ob=e.target.closest('[data-origin]');if(ob){origin=ob.dataset.origin;commuteStep=2;render('commute');return}const mb=e.target.closest('[data-mode]');if(mb){mode=mb.dataset.mode;commuteStep=1;mapOpen=false;detailsOpen=false;render('commute');return}const bb=e.target.closest('[data-buffer]');if(bb){buffer=Math.max(0,Math.min(30,buffer+Number(bb.dataset.buffer)));render('commute');return}const pb=e.target.closest('[data-prep]');if(pb){prep=Number(pb.dataset.prep);render('reminders');return}const scopeToggle=e.target.closest('[data-scope-toggle]');if(scopeToggle){const key=scopeToggle.dataset.scopeToggle;if(key==='calendar')calendarEnabled=!calendarEnabled;else prefs[key]=!prefs[key];const nowOn=key==='calendar'?calendarEnabled:prefs[key];scopeToggle.classList.toggle('selected',nowOn);return}
const pickDay=e.target.closest('[data-pick-day]');if(pickDay){const day=Number(pickDay.dataset.pickDay);const mm=facts.dateTime.match(/(\d{1,2})月/);const month=mm?Number(mm[1]):8;const d=new Date(2026,month-1,day);const wd=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];facts.dateTime=month+'月'+day+'日（'+wd+'）'+eventTime();factsModified=true;const cal=document.querySelector('.mini-calendar');if(cal)cal.remove();const label=document.querySelector('.fact-date-btn b');if(label)label.textContent=eventDateLabel();return}
const editField=e.target.closest('[data-edit-field]');if(editField&&!editField.querySelector('input')){const field=editField.dataset.editField;const val=field==='time'?eventTime():facts[field];document.querySelector('.mini-calendar')?.remove();editField.innerHTML='<input data-inline-fact="'+field+'" value="'+esc(val)+'">';const inp=editField.querySelector('input');inp.focus();inp.select();return}const pref=e.target.closest('[data-pref]');if(pref){const key=pref.dataset.pref;prefs[key]=!prefs[key];if(key==='alarm')alarmEnabled=prefs.alarm;render('reminders');return}const alarm=e.target.closest('[data-alarm]');if(alarm){alarmEnabled=!alarmEnabled;prefs.alarm=alarmEnabled;render('reminders');return}const planToggle=e.target.closest('[data-plan-toggle]');if(planToggle){const key=planToggle.dataset.planToggle;if(key==='calendar')calendarEnabled=!calendarEnabled;else prefs[key]=!prefs[key];render('plan');return}const lead=e.target.closest('[data-reminder-lead]');if(lead){reminderLead=Number(lead.dataset.reminderLead);render('reminderEdit');return}const togglePlan=e.target.closest('[data-toggle-plan]');if(togglePlan){prefs[togglePlan.dataset.togglePlan]=!prefs[togglePlan.dataset.togglePlan];render('reminderEdit');return}const a=e.target.closest('[data-a]')?.dataset.a;if(!a)return;if(a==='adjustMenu'){adjustReturn=(state==='task'||state==='taskMenu')?'task':'plan';render('adjustMenu')}else if(a==='closeAdjust'){render(adjustReturn)}else if(a==='saveCalendarPlan'){facts.dateTime=$('#planDateTime').value.trim()||facts.dateTime;facts.address=$('#planAddress').value.trim()||facts.address;render('plan')}else if(a==='saveReminderPlan'){facts.preparation=$('#reminderContent').value.trim()||facts.preparation;render('plan')}else if(a==='editCommute'){commuteStep=1;render('commute')}else if(a==='editCommuteAdjust'){commuteStep=2;render('commute')}else if(a==='closeProgress'){collapseIslandSheet();return}else if(a==='sources'){if(state!=='thirdParty')sourceReturn=state;render('sources')}else if(a==='closeSources'){render(sourceReturn==='home'?'home':sourceReturn==='plan'?'plan':'task')}else if(a==='finishPlanning'){render('finishing')}else if(a==='startProcessing'){conflictResolved=false;render('processing')}else if(a==='resumeProcessing'){conflictResolved=true;render('processing')}else if(a==='editFacts'){factsEditing=true;render('summary')}else if(a==='cancelFacts'){factsEditing=false;render('summary')}else if(a==='saveFacts'){document.querySelectorAll('[data-fact-field]').forEach(input=>facts[input.dataset.factField]=input.value.trim()||facts[input.dataset.factField]);factsEditing=false;factsModified=true;prep=null;alarmEnabled=false;prefs={reminders:true,travel:true,alarm:false,calendarAlert:false};commuteStep=1;mapOpen=false;detailsOpen=false;render('summary')}else if(a==='continueFacts'){commuteStep=1;mapOpen=false;detailsOpen=false;render('analysis')}else if(a==='toggleRules'){notificationOpen=!notificationOpen;render('commute')}else if(a==='toggleMap'){mapOpen=!mapOpen;render('commute')}else if(a==='toggleDetails'){detailsOpen=!detailsOpen;render('commute')}else if(a==='reschedule'){optionMode='draft';render('options')}else if(a==='optionList'){optionMode='list';render('options')}else if(a==='later'){pauseReason='later';render('paused')}else if(a==='saveDraft'){pauseReason='alex';render('draftSaved')}else if(a==='viewDraft'){optionMode='draft';render('options')}else if(a==='retry'){render('task')}else if(a==='undoConfirm'){render('undo')}else if(a==='toggleDatePicker'){toggleDatePicker()}else render(a)});
const commitInlineFact=inp=>{const field=inp.dataset.inlineFact;if(inp.dataset.committed)return;inp.dataset.committed='1';const val=inp.value.trim();if(field==='time'){if(val)facts.dateTime=eventDateLabel()+val}else{facts[field]=val||facts[field]}factsModified=true;render('suggest')};
function toggleDatePicker(){const existing=document.querySelector('.mini-calendar');if(existing){existing.remove();return}const mm=facts.dateTime.match(/(\d{1,2})月(\d{1,2})日/);const month=mm?Number(mm[1]):8,selDay=mm?Number(mm[2]):1;const startWeekday=new Date(2026,month-1,1).getDay();const daysInMonth=new Date(2026,month,0).getDate();let cells='';for(let i=0;i<startWeekday;i++)cells+='<span></span>';for(let d=1;d<=daysInMonth;d++)cells+='<button type="button" class="mini-cal-day'+(d===selDay?' selected':'')+'" data-pick-day="'+d+'">'+d+'</button>';const cal=document.createElement('div');cal.className='mini-calendar';cal.innerHTML='<div class="mini-cal-head">'+month+' 月</div><div class="mini-cal-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="mini-cal-grid">'+cells+'</div>';const host=document.querySelector('.suggest-facts');if(host)host.appendChild(cal)}
document.addEventListener('focusout',e=>{const inp=e.target.closest('[data-inline-fact]');if(inp)commitInlineFact(inp)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const inp=e.target.closest('[data-inline-fact]');if(inp)commitInlineFact(inp)}});
isl.onclick=()=>{if(state==='processing'||state==='finishing'){if(ov.querySelector('.island-sheet')){collapseIslandSheet()}else showProgress()}else if(state==='mail')render('suggest');else if(state==='reminders'&&!ov.innerHTML)render('reminders');else if(state==='today')render('today');else if(state==='paused')showPaused();else if(state==='waiting')render('draftSaved');else if(state==='draftSaved')render('draftSaved');else if(state==='failed')render('failed')};
if(requestedScreen){if(['plan','task','today'].includes(requestedScreen)){origin='home';prep=45}if(requestedScreen==='processing'){render('processing');showProgress()}else render(requestedScreen)}else render('mail');
