<header class="top"><div><div class="eyebrow">VERSION 1 · 低保真交互验证</div><h1>后台执行，过程可见，关键节点确认</h1><p>点击灵动岛开始。这个版本只验证 iPhone 设备框、AI 脉冲、授权、后台阶段、关键打断与撤销，不代表最终视觉。</p></div><a href="case-study.html">← 返回案例研究</a></header>
<main class="layout"><aside class="panel"><h2>状态导航</h2><p>按顺序体验，也可以直接跳转。</p><ol class="states" id="states"></ol><div class="note"><b>V1 验证重点</b><br>AI 脉冲是否轻量<br>授权前后是否清楚<br>后台进度是否可理解<br>什么时候应该打断</div></aside>
<section class="stage"><div class="phone-wrap"><div class="phone"><div class="screen"><div class="status"><span>9:41</span><span>● ᯤ ▰</span></div><button class="island" id="island"><i class="dot"></i><span>AI</span><span class="msg"></span><span class="count"></span></button><div class="app" id="app"></div><div class="overlay" id="overlay"></div></div></div></div><div class="caption"><b id="counter"></b><p id="caption"></p></div></section>

function island(mode,msg='',count=''){isl.className='island'+(mode==='pulse'?'':mode==='notice'?' notice':' wide')+(mode==='action'?' action':'')+(mode==='done'?' done':'');isl.setAttribute('aria-label',mode==='notice'?'AI recognized an interview invitation':'AI task status');isl.querySelector('.msg').textContent=msg;isl.querySelector('.count').textContent=count}
function collapseFloating(){let panel=ov.querySelector('.floating-task');if(!panel){ov.innerHTML='';return}panel.classList.add('collapsing');setTimeout(()=>{if(panel.classList.contains('collapsing'))ov.innerHTML=''},460)}function tasks(n){return stages.map((x,i)=>`<div class="task ${i<n-1?'done':''} ${i===n-1?'current':''}"><i>${i<n-1?'✓':i+1}</i><div><b>${x}</b><br><small>${i<n-1?'已完成':i===n-1?'正在处理':'等待'}</small></div></div>`).join('')}
function render(next){clearTimeout(noticeTimer);clearTimeout(autoTimer);clearTimeout(decisionTimer);state=next;ov.innerHTML='';if(next==='mail'){app.innerHTML=mail();island('pulse');noticeTimer=setTimeout(()=>{if(state==='mail')island('notice','发现一封面试邀请','要规划吗？')},700)}if(next==='suggest'){app.innerHTML=mail();island('notice','面试邀请已识别','规划建议');ov.innerHTML=`<div class="popover"><p class="kicker">AI 从当前邮件识别到面试安排</p><h3>需要我帮你安排这场面试吗？</h3><p>我可以先核对时间与地点，再检查日程、计算通勤并整理提醒。确认前不会执行任何操作。</p><div class="actions"><button class="btn primary" data-a="summary">查看规划</button><button class="btn secondary" data-a="mail">忽略</button></div></div>`}if(next==='summary'){app.innerHTML=mail();island('notice','邮件信息已整理','等待确认');ov.innerHTML=`<div class="popover expanded fact-confirm"><p class="kicker">来源 · Alex 的邮件</p><h2>请确认这些信息</h2><p class="sub">AI 将使用这些内容检查日程并生成计划。</p><div class="fact-list"><div><span>日期与时间</span><b>下周二 · 上午 10:30</b><em>原文</em></div><div><span>地点</span><b>555 Burrard Street</b><em>原文</em></div><div><span>提前到达</span><b>15 分钟</b><em>邮件</em></div><div><span>准备要求</span><b>携带作品集</b><em>邮件</em></div></div><p class="scope-boundary">现在只生成规划；创建 Calendar、提醒或草稿前会再次确认。</p><div class="actions"><button class="btn primary" data-a="authorize">信息正确，开始规划</button><button class="btn secondary" data-a="suggest">返回</button></div></div>`}
if(next==='processing'||next==='tracking'){let n=next==='tracking'?5:step;let appStep=Math.max(0,n-1);app.innerHTML=mail();ov.innerHTML=`<div class="floating-task" role="dialog" aria-label="AI 后台规划进度"><div class="float-head"><div><p>AI 正在后台规划</p><h2>${next==='tracking'?'持续跟进':stages[n-1]}</h2></div><span class="float-count">${next==='tracking'?'3/3':Math.min(appStep,3)+'/3'}</span></div><div class="bar"><div class="fill" style="width:${Math.min(appStep,3)/3*100}%"></div></div><div class="task-rail">${[['Calendar','检查日程冲突'],['Maps','路线与出发时间'],['Reminders','准备与出发提醒']].map((x,i)=>{let status=i<appStep?'done':i===appStep&&appStep<3?'current':'waiting';return `<div class="rail-card ${status}"><div class="rail-top"><span>0${i+1}</span><span class="rail-state">${status==='done'?'✓ 已完成':status==='current'?'● 处理中':'等待'}</span></div><b>${x[0]}</b><small>${x[1]}</small></div>`}).join('')}</div><div class="float-actions"><button class="btn text" data-a="minimize">收起浮窗</button><span class="auto-note">${next==='tracking'?'即将自动收起':'AI 将自动继续'}</span></div></div>`;island('progress',next==='tracking'?'持续跟进':stages[n-1],next==='tracking'?'3/3':Math.min(appStep,3)+'/3');if(next==='processing')autoTimer=setTimeout(()=>{step++;if(step===2)render('action');else if(step>=5)render('plan');else render('processing')},1600);else autoTimer=setTimeout(()=>{if(state==='tracking')collapseFloating()},2800)}if(next==='action'){app.innerHTML=mail();island('action','日程有冲突','!');ov.innerHTML=`<div class="popover conflict-pop"><div class="warning">需要你的决定</div><h2>发现日程冲突</h2><p class="sub">面试与现有课程重叠，AI 已暂停后续规划。</p><div class="conflict"><div class="event"><b>课程</b><br>10:00–11:00</div><span>↔</span><div class="event"><b>面试</b><br>10:30–11:30</div></div><div class="actions"><button class="btn primary" data-a="resolve">保留两个事件并继续</button><button class="btn secondary" data-a="options">查看其他方案</button></div><p class="timeout-note">暂不回应时，任务会保持暂停并收起到灵动岛；系统不会自动替你选择。</p></div>`;decisionTimer=setTimeout(()=>{if(state==='action'){ov.innerHTML='';island('action','日程有冲突','待处理')}},5000)}if(next==='options'){app.innerHTML=mail();island('action',optionMode==='draft'?'改期草稿':'选择处理方式',optionMode==='draft'?'待确认':'3 个方案');ov.innerHTML=optionMode==='draft'?`<div class="popover expanded conflict-pop"><p class="kicker">AI 草稿 · 不会自动发送</p><h2>联系 Alex 申请改期</h2><p class="sub">时间尚未确定，Maps 和 Reminders 将继续暂停。</p><div class="draft-box">Hi Alex,<br><br>Thank you for the invitation. I have a schedule conflict at the proposed time. Would it be possible to discuss another interview time?<br><br>Best,<br>Jade</div><div class="actions"><button class="btn primary" data-a="saveDraft">保存草稿并等待回复</button><button class="btn secondary" data-a="optionList">返回方案</button></div></div>`:`<div class="popover expanded conflict-pop"><p class="kicker">日程冲突 · 选择处理方式</p><h2>你希望如何继续？</h2><p class="sub">AI 会根据选择继续；没有选择时任务保持暂停。</p><div class="option-list"><button class="option-card" data-a="reschedule"><b>联系 Alex 改期</b><span>准备一封改期草稿，不自动发送；等待新时间后再继续路线与提醒。</span></button><button class="option-card" data-a="keepInterview"><b>保留面试，处理课程</b><span>保留面试安排，并提醒你联系老师或处理课程。</span></button><button class="option-card" data-a="later"><b>稍后决定</b><span>保持任务暂停，并收起到灵动岛。</span></button></div><div class="actions"><button class="btn text" data-a="action">返回冲突</button></div></div>`}if(next==='plan'){app.innerHTML=mail();island('progress','计划已准备','3/3');ov.innerHTML=`<div class="popover expanded plan-pop"><p class="kicker">AI 计划 · 尚未执行</p><h2>面试准备计划已完成</h2><p class="sub">三个规划步骤已完成。确认后才会写入系统。</p><div class="task-rail"><div class="rail-card done"><div class="rail-top"><span>01</span><span class="rail-state">✓ 已完成</span></div><b>Calendar</b><small>已检查日程冲突</small></div><div class="rail-card done"><div class="rail-top"><span>02</span><span class="rail-state">✓ 已完成</span></div><b>Maps</b><small>已计算路线与出发时间</small></div><div class="rail-card done"><div class="rail-top"><span>03</span><span class="rail-state">✓ 已完成</span></div><b>Reminders</b><small>已整理准备与出发提醒</small></div></div><p class="plan-label">通勤建议</p><div class="calc"><span>面试开始</span><b>10:30</b><span>提前到达</span><b>15 分钟</b><span>公共交通</span><b>32 分钟</b><span>额外缓冲</span><b>8 分钟</b><span class="result">建议出发</span><b class="result">9:35</b></div><div class="actions"><button class="btn primary" data-a="confirm">确认并执行</button><button class="btn secondary">修改计划</button></div></div>`}if(next==='complete'){island('done','准备完成','✓');app.innerHTML=`<div class="success"><div class="check">✓</div><h2>面试准备已完成</h2><p class="sub">系统已完成 3 项操作，邮件仍保存为草稿。</p><div class="rows"><div class="task done"><i>✓</i><div><b>日历事件已创建</b><br>下周二 10:30</div></div><div class="task done"><i>✓</i><div><b>提醒已设置</b><br>作品集 · 9:20 出发</div></div><div class="task done"><i>✓</i><div><b>回复草稿已准备</b><br>等待确认发送</div></div></div><button class="btn secondary" style="width:100%">查看并撤销</button></div>`}update()}
function update(){let i=info[state];$('#counter').textContent=`状态 ${S.findIndex(x=>x[0]===state)+1} / ${S.length}`;$('#caption').textContent=i[0];$('#intro').textContent=i[1];$('#user').textContent=i[2];$('#ai').textContent=i[3];$('#system').textContent=i[4];$('#decision').textContent=i[5];$('#hint').textContent=i[6];document.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('active',b.dataset.s===state))}
$('#states').innerHTML=S.map((x,i)=>`<li><button data-s="${x[0]}">${String(i+1).padStart(2,'0')} · ${x[1]}</button></li>`).join('');document.addEventListener('click',e=>{let s=e.target.closest('[data-s]')?.dataset.s;if(s){if(s==='processing')step=1;render(s)}let a=e.target.closest('[data-a]')?.dataset.a;if(!a)return;if(a==='minimize'){collapseFloating();return}if(a==='reschedule'){optionMode='draft';render('options')}else if(a==='optionList'){optionMode='list';render('options')}else if(a==='keepInterview'){step=3;render('processing')}else if(a==='later'){state='options';ov.innerHTML='';island('action','日程有冲突','待处理');update()}else if(a==='saveDraft'){state='options';ov.innerHTML='';island('action','等待 Alex 回复','暂停');update()}else if(a==='authorize'){step=1;render('processing')}else if(a==='next'){if(state==='tracking')render('complete');else{step++;if(step===2)render('action');else if(step>=5)render('plan');else render('processing')}}else if(a==='resolve'){step=3;render('processing')}else if(a==='confirm')render('tracking');else render(a)});isl.onclick=()=>{if(state==='mail')render('suggest');else if((state==='processing'||state==='tracking'||state==='action'||state==='options')&&!ov.innerHTML)render(state)};const requestedScreen=new URLSearchParams(location.search).get('screen');if(requestedScreen){if(requestedScreen==='processing')step=1;render(requestedScreen)}else render('mail');
</script></body></html>
